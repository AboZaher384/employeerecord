<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تعديل بيانات موظف</title><link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav><a href="index.html" class="nav-brand"><div class="logo-icon">👥</div>سجل الموظفين</a><a href="index.html" class="nav-home">🏠 الرئيسية</a></nav>
  <div class="container">
    <div class="page-title fade-up"><span class="icon">📝</span><h1>تعديل بيانات موظف</h1><p>ابحث عن الموظف وعدّل بياناته</p></div>
    <div class="card fade-up" style="animation-delay:.1s">
      <div id="alert-box"></div>
      <div class="form-group"><label>🔍 اسم الموظف أو رقمه</label><input type="text" id="search" placeholder="أدخل الاسم أو الرقم..."/></div>
      <button class="btn btn-secondary btn-full" id="search-btn" onclick="searchEmployee()" style="margin-bottom:20px">🔍 بحث</button>
      <div id="edit-section" class="hidden">
        <div class="emp-result" style="margin-bottom:20px"><div class="emp-avatar" id="emp-avatar"></div><div class="emp-info"><h3 id="emp-label"></h3><p style="color:var(--text-muted);font-size:.85rem">بيانات قابلة للتعديل</p></div></div>
        <div class="form-group"><label>👤 الاسم</label><input type="text" id="edit-name"/></div>
        <div class="form-group"><label>📱 رقم الجوال</label><input type="tel" id="edit-phone"/></div>
        <div class="grid-2">
          <div class="form-group"><label>📅 تاريخ التعيين</label><input type="date" id="edit-hire"/></div>
          <div class="form-group"><label>💰 سعر الساعة</label><input type="number" id="edit-rate" min="0" step="0.01"/></div>
        </div>
        <button class="btn btn-primary btn-full" id="save-btn" onclick="saveEmployee()">💾 حفظ التعديلات</button>
      </div>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    requireAuth(); let selectedEmp=null;
    async function searchEmployee(){
      const q=document.getElementById('search').value.trim().toLowerCase();
      if(!q){showAlert('⚠️ أدخل اسم أو رقم','error');return;}
      const btn=document.getElementById('search-btn');loading(btn,true);
      try{
        const res=await apiPost({action:'getEmployees'});
        const emp=(res.data||[]).find(e=>e.name.toLowerCase().includes(q)||String(e.id)===q);
        if(!emp){showAlert('❌ لم يتم العثور على الموظف','error');loading(btn,false);return;}
        selectedEmp=emp;
        document.getElementById('emp-avatar').textContent=emp.name.charAt(0);
        document.getElementById('emp-label').textContent=`${emp.name} — رقم #${emp.id}`;
        document.getElementById('edit-name').value=emp.name;
        document.getElementById('edit-phone').value=emp.phone;
        document.getElementById('edit-hire').value=emp.hire_date;
        document.getElementById('edit-rate').value=emp.hourly_rate;
        document.getElementById('edit-section').classList.remove('hidden');
      }catch(e){showAlert('❌ تعذر الاتصال','error');}
      loading(btn,false);
    }
    async function saveEmployee(){
      const name=document.getElementById('edit-name').value.trim();
      const phone=document.getElementById('edit-phone').value.trim();
      const hire_date=document.getElementById('edit-hire').value;
      const hourly_rate=parseFloat(document.getElementById('edit-rate').value);
      if(!name||!phone||!hire_date||isNaN(hourly_rate)){showAlert('⚠️ يرجى ملء جميع الحقول','error');return;}
      const btn=document.getElementById('save-btn');loading(btn,true);
      try{
        const res=await apiPost({action:'updateEmployee',id:selectedEmp.id,name,phone,hire_date,hourly_rate});
        if(res.success){showAlert('✅ تم حفظ التعديلات','success');document.getElementById('emp-label').textContent=`${name} — رقم #${selectedEmp.id}`;document.getElementById('emp-avatar').textContent=name.charAt(0);}
        else{showAlert('❌ '+res.message,'error');}
      }catch(e){showAlert('❌ تعذر الاتصال','error');}
      loading(btn,false);
    }
  </script>
</body>
</html>
