<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تعديل وقت الدخول والخروج</title><link rel="stylesheet" href="style.css"/>
  <style>
    .rec-item{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
    .rec-item:hover,.rec-item.selected{border-color:var(--accent)}.rec-item.selected{background:rgba(201,150,58,0.1)}
    .rec-item .rec-date{font-weight:700;margin-bottom:6px}.rec-item .rec-times{display:flex;gap:16px;font-size:.85rem}
    .rec-in{color:#2ecc71}.rec-out{color:#e74c3c}
    .edit-block{background:var(--bg-card2);border:1px solid var(--accent);border-radius:var(--radius);padding:22px;margin-top:20px}
    .edit-block h3{color:var(--accent-light);font-size:1rem;font-weight:700;margin-bottom:18px}
    .time-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:480px){.time-row{grid-template-columns:1fr}}
    .field-group{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
    .field-group label{display:block;font-size:.8rem;font-weight:700;margin-bottom:10px}
    .field-group.in-group label{color:#2ecc71}.field-group.out-group label{color:#e74c3c}
    .field-group input{width:100%;padding:9px 12px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Cairo',sans-serif;font-size:.95rem;direction:rtl}
    .field-group input:focus{outline:none;border-color:var(--accent)}
  </style>
</head>
<body>
  <nav><a href="index.html" class="nav-brand"><div class="logo-icon">👥</div>سجل الموظفين</a><a href="index.html" class="nav-home">🏠 الرئيسية</a></nav>
  <div class="container">
    <div class="page-title fade-up"><span class="icon">✏️</span><h1>تعديل وقت الدخول والخروج</h1><p>ابحث عن الموظف واختر السجل</p></div>
    <div class="card fade-up" style="animation-delay:.1s">
      <div id="alert-box"></div>
      <div class="form-group"><label>🔍 اسم الموظف أو رقمه</label><input type="text" id="search" placeholder="أدخل الاسم أو الرقم..."/></div>
      <button class="btn btn-secondary btn-full" id="search-btn" onclick="searchEmployee()" style="margin-bottom:20px">🔍 بحث</button>
      <div id="emp-section" class="hidden">
        <div class="emp-result" style="margin-bottom:20px"><div class="emp-avatar" id="emp-avatar"></div><div class="emp-info"><h3 id="emp-name"></h3><p id="emp-detail"></p></div></div>
        <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:12px">📋 اختر السجل:</p>
        <div id="records-list"></div>
        <div id="edit-form" class="hidden">
          <div class="edit-block">
            <h3>✏️ تعديل السجل</h3>
            <div class="form-group"><label>📅 التاريخ</label><input type="date" id="edit-date"/></div>
            <div class="time-row" style="margin-top:14px">
              <div class="field-group in-group"><label>🟢 وقت الدخول</label><input type="time" id="edit-checkin"/></div>
              <div class="field-group out-group"><label>🔴 وقت الخروج</label><input type="time" id="edit-checkout"/></div>
            </div>
            <div style="margin-top:18px"><button class="btn btn-primary btn-full" id="save-btn" onclick="saveEdit()">💾 حفظ التعديلات</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    requireAuth(); let selectedEmp=null,empRecords=[],selectedIdx=-1;
    async function searchEmployee(){
      const q=document.getElementById('search').value.trim().toLowerCase();
      if(!q){showAlert('⚠️ أدخل اسم أو رقم','error');return;}
      const btn=document.getElementById('search-btn');loading(btn,true);
      try{
        const res=await apiPost({action:'getEmployees'});
        const emp=(res.data||[]).find(e=>e.name.toLowerCase().includes(q)||String(e.id)===q);
        if(!emp){showAlert('❌ لم يتم العثور على الموظف','error');loading(btn,false);return;}
        selectedEmp=emp;
        document.getElementById('emp-avatar').textContent=emp.name.charAt(0);
        document.getElementById('emp-name').textContent=emp.name;
        document.getElementById('emp-detail').textContent=`رقم: #${emp.id}`;
        document.getElementById('emp-section').classList.remove('hidden');
        document.getElementById('edit-form').classList.add('hidden');
        loadRecords();
      }catch(e){showAlert('❌ تعذر الاتصال','error');}
      loading(btn,false);
    }
    function loadRecords(){
      const all=Attendance.getAll();
      empRecords=all.map((r,i)=>({...r,_idx:i})).filter(r=>String(r.emp_id)===String(selectedEmp.id));
      empRecords.sort((a,b)=>b.date>a.date?1:-1);
      renderRecords();
    }
    function renderRecords(){
      const list=document.getElementById('records-list');
      if(!empRecords.length){list.innerHTML='<div class="alert alert-info">⚠️ لا توجد سجلات</div>';return;}
      list.innerHTML=empRecords.map((r,i)=>`<div class="rec-item" onclick="selectRecord(${i})" id="rec-${i}"><div class="rec-date">📅 ${r.date}</div><div class="rec-times"><span class="rec-in">🟢 دخول: ${r.checkin||'—'}</span><span class="rec-out">🔴 خروج: ${r.checkout||'—'}</span></div></div>`).join('');
    }
    function selectRecord(i){
      selectedIdx=i;
      document.querySelectorAll('.rec-item').forEach(el=>el.classList.remove('selected'));
      document.getElementById(`rec-${i}`).classList.add('selected');
      document.getElementById('edit-date').value=empRecords[i].date||'';
      document.getElementById('edit-checkin').value=empRecords[i].checkin||'';
      document.getElementById('edit-checkout').value=empRecords[i].checkout||'';
      document.getElementById('edit-form').classList.remove('hidden');
      document.getElementById('edit-form').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    function saveEdit(){
      const date=document.getElementById('edit-date').value;
      const checkin=document.getElementById('edit-checkin').value;
      const checkout=document.getElementById('edit-checkout').value;
      if(!date){showAlert('⚠️ أدخل التاريخ','error');return;}
      const realIdx=empRecords[selectedIdx]._idx;
      const updated={...empRecords[selectedIdx],date,checkin,checkout};
      delete updated._idx;
      Attendance.update(realIdx,updated);
      showAlert('✅ تم حفظ التعديلات بنجاح','success');
      document.getElementById('edit-form').classList.add('hidden');
      loadRecords();
    }
  </script>
</body>
</html>
