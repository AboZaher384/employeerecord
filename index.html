<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>سجل الموظفين</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; }
    .hero { text-align:center; padding:20px; animation:fadeUp .6s ease forwards; }
    .logo-wrap { position:relative; display:inline-block; margin-bottom:24px; }
    .logo-svg { width:110px; height:110px; filter:drop-shadow(0 8px 24px rgba(201,150,58,.4)); }
    .logo-ring { position:absolute; inset:-10px; border:2px solid rgba(201,150,58,.2); border-radius:50%; animation:spin 12s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .hero h1 { font-family:'Tajawal',sans-serif; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:900; background:linear-gradient(135deg,#e8b455,#c9963a,#fff5e0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:6px; }
    .user-bar { display:inline-flex; align-items:center; gap:10px; background:var(--bg-card); border:1px solid var(--border); border-radius:30px; padding:8px 16px; margin-bottom:28px; font-size:.85rem; }
    .user-bar .dot { width:8px; height:8px; border-radius:50%; background:var(--success); }
    .user-bar .uname { color:var(--accent-light); font-weight:700; }
    .user-bar button { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:.8rem; font-family:'Cairo',sans-serif; padding:2px 8px; border-radius:4px; transition:.2s; }
    .user-bar button:hover { color:var(--danger); }
    .menu-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:680px; width:100%; }
    @media(max-width:600px){.menu-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:380px){.menu-grid{grid-template-columns:1fr}}
    .menu-item { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px 14px; text-align:center; text-decoration:none; color:var(--text); transition:all .25s; display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; overflow:hidden; }
    .menu-item::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--accent-light)); transform:scaleX(0); transition:.25s; }
    .menu-item:hover { border-color:var(--accent); transform:translateY(-4px); box-shadow:0 12px 32px rgba(201,150,58,.2); }
    .menu-item:hover::before { transform:scaleX(1); }
    .menu-item .menu-icon { font-size:1.9rem; line-height:1; }
    .menu-item .menu-num { position:absolute; top:10px; left:10px; background:var(--primary); color:var(--accent-light); width:22px; height:22px; border-radius:50%; font-size:.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .menu-item span { font-size:.85rem; font-weight:600; color:var(--text-muted); }
    .menu-item:nth-child(1) .menu-icon{color:#2ecc71}
    .menu-item:nth-child(2) .menu-icon{color:#3498db}
    .menu-item:nth-child(3) .menu-icon{color:#e74c3c}
    .menu-item:nth-child(4) .menu-icon{color:#f39c12}
    .menu-item:nth-child(5) .menu-icon{color:#9b59b6}
    .menu-item:nth-child(6) .menu-icon{color:#1abc9c}
    .menu-item:nth-child(7) .menu-icon{color:#e67e22}
    .menu-item:nth-child(8) .menu-icon{color:#27ae60}
    .menu-item:nth-child(9) .menu-icon{color:#c9963a}
  </style>
</head>
<body>
  <div class="hero">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <svg class="logo-svg" viewBox="0 0 120 120" fill="none">
        <circle cx="60" cy="60" r="56" fill="#1a3a5c" stroke="#c9963a" stroke-width="2"/>
        <circle cx="60" cy="42" r="16" fill="#c9963a"/>
        <path d="M28 90 Q28 68 60 68 Q92 68 92 90" fill="#c9963a" opacity=".9"/>
        <rect x="72" y="58" width="28" height="3" rx="1.5" fill="#e8b455"/>
        <rect x="72" y="65" width="22" height="3" rx="1.5" fill="#e8b455" opacity=".6"/>
        <rect x="72" y="72" width="25" height="3" rx="1.5" fill="#e8b455" opacity=".4"/>
      </svg>
    </div>
    <h1>سجل الموظفين</h1>
    <div class="user-bar">
      <div class="dot"></div>
      <span>مرحباً، <span class="uname" id="user-name">...</span></span>
      <button onclick="logout()">خروج 🚪</button>
    </div>
    <div class="menu-grid">
      <a href="add-employee.html" class="menu-item"><div class="menu-num">1</div><div class="menu-icon">➕</div><span>إضافة موظف</span></a>
      <a href="checkin.html"      class="menu-item"><div class="menu-num">2</div><div class="menu-icon">🟢</div><span>تسجيل دخول</span></a>
      <a href="checkout.html"     class="menu-item"><div class="menu-num">3</div><div class="menu-icon">🔴</div><span>تسجيل خروج</span></a>
      <a href="hours.html"        class="menu-item"><div class="menu-num">4</div><div class="menu-icon">⏱️</div><span>ساعات الدوام</span></a>
      <a href="edit-attendance.html" class="menu-item"><div class="menu-num">5</div><div class="menu-icon">✏️</div><span>تعديل وقت دخول</span></a>
      <a href="edit-employee.html"   class="menu-item"><div class="menu-num">6</div><div class="menu-icon">📝</div><span>تعديل بيانات</span></a>
      <a href="advance.html"      class="menu-item"><div class="menu-num">7</div><div class="menu-icon">💰</div><span>سلفة موظف</span></a>
      <a href="salary.html"       class="menu-item"><div class="menu-num">8</div><div class="menu-icon">💵</div><span>حساب الراتب</span></a>
      <a href="employees.html"    class="menu-item"><div class="menu-num">9</div><div class="menu-icon">👥</div><span>قائمة الموظفين</span></a>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (user) document.getElementById('user-name').textContent = user.name;
    })();
  </script>
</body>
</html>
