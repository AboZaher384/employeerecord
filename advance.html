<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>سلفة موظف</title><link rel="stylesheet" href="style.css"/>
  <style>
    .advance-item{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .adv-date{color:var(--text-muted);font-size:.85rem}.adv-amount{color:var(--warning);font-weight:800;font-size:1.1rem}
    .total-adv{background:rgba(243,156,18,0.15);border:1px solid rgba(243,156,18,0.3);border-radius:var(--radius-sm);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .total-adv .label{color:var(--text-muted);font-size:.9rem}.total-adv .value{color:var(--warning);font-weight:900;font-size:1.2rem}
  </style>
</head>
<body>
  <nav><a href="index.html" class="nav-brand"><div class="logo-icon">👥</div>سجل الموظفين</a><a href="index.html" class="nav-home">🏠 الرئيسية</a></nav>
  <div class="container">
    <div class="page-title fade-up"><span class="icon">💰</span><h1>سلفة موظف</h1><p>تسجيل السلفة وعرض سجل السلف</p></div>
    <div class="card fade-up" style="animation-delay:.1s">
      <div id="alert-box"></div>
      <div class="form-group"><label>🔍 اسم الموظف أو رقمه</label><input type="text" id="search" placeholder="أدخل الاسم أو الرقم..."/></div>
      <button class="btn btn-secondary btn-full" id="search-btn" onclick="searchEmployee()" style="margin-bottom:20px">🔍 بحث</button>
      <div id="emp-section" class="hidden">
        <div class="emp-result" style="margin-bottom:20px"><div class="emp-avatar" id="emp-avatar"></div><div class="emp-info"><h3 id="emp-name"></h3><p id="emp-detail"></p></div></div>
        <div id="advances-history"></div>
        <hr class="divider"/>
        <p style="font-weight:700;margin-bottom:16px;color:var(--accent-light)">➕ تسجيل سلفة جديدة</p>
        <div class="grid-2">
          <div class="form-group"><label>💵 مبلغ السلفة </label><input type="number" id="adv-amount" placeholder="0.00" min="0" step="0.01"/></div>
          <div class="form-group"><label>📅 تاريخ السحب</label><input type="date" id="adv-date"/></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveAdvance()">💾 تسجيل السلفة</button>
      </div>
    </div>
  </div>
  <script src="api.js"></script>
  <script>
    requireAuth(); let selectedEmp=null;
    async function searchEmployee(){
      const q=document.getElementById('search').value.trim().toLowerCase();
      if(!q){showAlert('⚠️ أدخل اسم أو رقم','error');return;}
      const btn=document.getElementById('search-btn');loading(btn,true);
      try{
        const res=await apiPost({action:'getEmployees'});
        const emp=(res.data||[]).find(e=>e.name.toLowerCase().includes(q)||String(e.id)===q);
        if(!emp){showAlert('❌ لم يتم العثور على الموظف','error');loading(btn,false);return;}
        selectedEmp=emp;
        document.getElementById('emp-avatar').textContent=emp.name.charAt(0);
        document.getElementById('emp-name').textContent=emp.name;
        document.getElementById('emp-detail').textContent=`رقم: #${emp.id}`;
        document.getElementById('adv-date').value=new Date().toISOString().split('T')[0];
        document.getElementById('emp-section').classList.remove('hidden');
        renderAdvances();
      }catch(e){showAlert('❌ تعذر الاتصال','error');}
      loading(btn,false);
    }
    function renderAdvances(){
      const empAdv=Advances.forEmployee(selectedEmp.id);
      const hist=document.getElementById('advances-history');
      if(!empAdv.length){hist.innerHTML='';return;}
      const total=empAdv.reduce((s,a)=>s+Number(a.amount),0);
      hist.innerHTML=`<div class="total-adv"><span class="label">💰 إجمالي السلف</span><span class="value">${total.toFixed(2)} </span></div>${empAdv.map(a=>`<div class="advance-item"><div><div style="font-weight:600">سلفة</div><div class="adv-date">${a.date}</div></div><div class="adv-amount">${Number(a.amount).toFixed(2)} </div></div>`).join('')}<hr class="divider"/>`;
    }
    function saveAdvance(){
      const amount=parseFloat(document.getElementById('adv-amount').value);
      const date=document.getElementById('adv-date').value;
      if(!amount||amount<=0||!date){showAlert('⚠️ أدخل المبلغ والتاريخ','error');return;}
      Advances.add({emp_id:selectedEmp.id,emp_name:selectedEmp.name,amount,date});
      showAlert(`✅ تم تسجيل سلفة ${amount} `,'success');
      document.getElementById('adv-amount').value='';
      renderAdvances();
    }
  </script>
</body>
</html>
